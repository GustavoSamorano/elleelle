.arw{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(248,245,239,.86);font-family:'Cormorant';font-size:34px;line-height:44px;color:var(--ink);transition:background .2s}
.arw:hover{background:#fff}.arw.l{left:18px}.arw.r{right:18px}
.cnt{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.cnt button{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid transparent}.cnt button:hover{border-color:var(--br)}
.stage:fullscreen{height:100vh;background:#F3EFE8}
.thumbs{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;width:96px;height:72px;background:#F1EDE6;opacity:.55;border-bottom:1.5px solid transparent;transition:opacity .2s}
.thumbs button.on{opacity:1;border-color:var(--br)}.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
@media (max-width:900px){.stage{height:52vh}.arw{width:40px;height:40px;font-size:28px;line-height:36px}.show .sh{flex-wrap:wrap}}
.acts.a2{margin-top:10px}.shw{flex:1;position:relative;display:flex}.shw .btn{flex:1}
.shm{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--ink);z-index:5;display:flex;flex-direction:column}
.shm button{padding:12px 14px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line)}.shm button:last-child{border-bottom:0}.shm button:hover{background:var(--bg)}
.scroll{flex:1;overflow:auto;min-height:0}
aside .items{flex:none;overflow:visible}
.obsbox{padding:16px 24px 20px}
.obsbox textarea{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:none;padding:9px 10px;font:inherit;font-size:13px;line-height:1.45;color:var(--ink);outline:none;resize:vertical;border-radius:0}
.obsbox textarea:focus{border-color:var(--br)}
.tl select{border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--ink);padding:2px 0;outline:none;text-align:right;max-width:190px;border-radius:0}
.tl select.vz{color:var(--br2)}
.tot{padding-top:12px}.tot .tl{padding:3px 0}.tl.big{padding-top:8px;font-size:28px}
.tec{grid-column:1/-1;margin-top:8px}
.tec select,.tec input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;font:inherit;font-size:12.5px;color:var(--ink);outline:none;border-radius:0}
.tec select:focus,.tec input:focus{border-color:var(--br)}
.tec select.vz{color:var(--br2)}
@media (max-width:900px){#login{grid-template-columns:1fr}#login .l{padding:28px}#login .l h1{font-size:40px}header{flex-wrap:wrap}header nav{margin-left:0}tr.h td.hm{display:none}th.hm{display:none}}
@media print{#login,#toast{display:none!important}.fim{display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;margin-top:7mm;break-inside:avoid}.fim .dt{margin:0;flex:none}.cond{display:flex;gap:12mm;font-size:10pt}.cond .lab{display:block;font-size:6.5pt;margin-bottom:1.5mm}.obs.ped p{font-size:9pt;color:var(--ink);white-space:pre-wrap;line-height:1.5}.meta{grid-template-columns:1.3fr 1fr 1fr .7fr!important}}
</style></head><body>

    return `<div class="tec"><select data-tom="${i}" class="${it.tom?'':'vz'}"><option value="">Tonalidade a definir</option>${l.map(c=>`<option ${c===it.tom?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`}
  if(it.mesa||it.notec)return '';
  if(it.op==='FORN')return `<div class="tec"><input data-tecf="${i}" placeholder="Tecido fornecido (descrição)" value="${esc(it.tecido||'')}" maxlength="80"></div>`;
  const l=(T[it.op]||[]).slice(); if(it.tecido&&!l.includes(it.tecido))l.unshift(it.tecido); if(!l.length)return '';
  return `<div class="tec"><select data-tec="${i}" class="${it.tecido?'':'vz'}"><option value="">Tecido a definir · Grupo ${esc(it.op)}</option>${l.map(c=>`<option ${c===it.tecido?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`}

const touch=()=>{S.cur.dirty=true};
async function salvar(){
  const c=S.cur,t=totals(),row={cliente:c.cliente,referencia:c.ref,edicao:ED,itens:c.items,desconto:t.d,subtotal:Math.round(t.sub),total:Math.round(t.tot),ipi:Math.round(t.ipi),prazo:c.prazo||null,obs:c.obs||null};
  $('#sal').disabled=true;
  const q=c.id?sb.from('orcamentos').update(row).eq('id',c.id):sb.from('orcamentos').insert(row);
  const {data,error}=await q.select().single();
  if(error){toast(/column|schema/i.test(error.message||'')||error.code==='PGRST204'?'O banco ainda não tem os campos novos: rode o 5_campos.sql.':'Não foi possível salvar. Tente novamente.');side();return}
  c.id=data.id;c.owner=data.user_id;c.criado=data.criado_em;c.dirty=false;S.hist=null;toast('Orçamento salvo.');side();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-cart],[data-xadd],[data-xcol],[data-busca],[data-sm],[data-fi],[data-nav],[data-fs],[data-precos],[data-col],[data-tab],[data-m],[data-back],[data-op],[data-add],[data-q],[data-rm],[data-view],[data-sair],[data-abrir],[data-del]');if(!t)return;
  const d=t.dataset,c=S.cur;
  if(d.col){S.view='cat';S.col=d.col;S.model=null;S.q='';main()}
  else if(d.tab){S.tab=d.tab;S.q='';main()}
  else if(d.m){S.model=+d.m;S.col=colOf(M[S.model]);main();$('main').scrollTop=0}
  else if('back' in d){S.model=null;main()}
  else if(d.view){S.view=d.view;if(d.view==='hist')S.hist=null;if(d.view==='show')S.show=null;main();$('main').scrollTop=0}
  else if(d.cart!=null){cart(d.cart==='1')}
  else if(d.xcol){S.xcol=d.xcol;main()}
  else if(d.xadd!=null){addExposto(+d.xadd)}
  else if(d.busca){S.view='cat';S.col=d.bcol;S.model=null;S.q=d.busca;main();$('main').scrollTop=0}
  else if(d.sm!=null){S.show=d.sm===''?null:+d.sm;S.foto=0;main();$('main').scrollTop=0}
  else if(d.fi!=null){setFoto(+d.fi)}
  else if(d.nav){setFoto(S.foto+(+d.nav))}
  else if('fs' in d){const st=$('.stage');if(document.fullscreenElement)document.exitFullscreen();else if(st&&st.requestFullscreen)st.requestFullscreen().catch(()=>{})}
  else if(d.precos!=null){const i=+d.precos;S.view='cat';S.col=colOf(M[i]);S.tab=M[i].linha;S.model=i;S.q='';main();$('main').scrollTop=0}
  else if('sair' in d){await sb.auth.signOut()}
  else if(d.op){const m=M[S.model];if(isMesa(m))S.acab=d.op;else S.grupo=d.op;main();draft()}
  else if(d.add){const m=M[S.model],r=m.rows[+d.add],op=opOf(m),p=r.pr[m.ops.indexOf(op)];
    const ex=c.items.find(it=>it.nome===m.nome&&it.ref===r.ref&&it.op===op&&!it.tecido&&!it.tom);
    if(ex)ex.q++;else c.items.push({nome:m.nome,op,oplab:r.notec?'—':isMesa(m)?(m.ops.length>1?op:'—'):(op==='FORN'?'Revestimento fornecido':'Grupo '+op),ref:r.ref,dims:r.dims,tec:r.tec,somar:r.somar,preco:p,q:1,say:false,mesa:isMesa(m),tecido:'',tom:'',notec:!!r.notec});
    touch();main();side()}
  else if(d.q){const it=c.items[+d.i];it.q+=+d.q;if(it.q<1)c.items.splice(+d.i,1);touch();main();side()}
  else if(d.rm){c.items.splice(+d.rm,1);touch();main();side()}
  else if(d.abrir){
    if(c.dirty&&c.items.length&&!ro()&&!arm(t,'Descartar atual?'))return;
    const o=S.hist.find(x=>x.id===d.abrir);if(!o)return;
    S.cur={id:o.id,owner:o.user_id,criado:o.criado_em,cliente:o.cliente||'',ref:o.referencia||'',desc:+o.desconto||0,prazo:o.prazo||'',obs:o.obs||'',items:JSON.parse(JSON.stringify(o.itens||[])),dirty:false};
    S.view='cat';S.model=null;main();side()}
  else if(d.del){
    if(!arm(t,'Confirmar'))return;
    const {error}=await sb.from('orcamentos').delete().eq('id',d.del);
    if(error){toast('Não foi possível excluir.');return}
    if(c.id===d.del){S.cur=novo();side()}
    S.hist=S.hist.filter(x=>x.id!==d.del);main();toast('Orçamento excluído.')}
});

function addExposto(k){

function vitrine(el){
  if(S.show==null){
    const SEC=COLS.flatMap(co=>LINHAS.map(l=>[co,l])).filter(([co,l])=>CATALOGO.some(c=>c.col===co&&c.linha===l));
    el.innerHTML=`<div class="hh"><h1>Catálogo</h1><span class="sum">${CATALOGO.length} modelos · ${CATALOGO.reduce((a,c)=>a+c.fotos.length,0)} fotos</span></div>`+
      SEC.map(([co,l])=>`<div class="vl"><span>${co} <i>·</i> ${l}</span></div><div class="grid">${CATALOGO.map((c,i)=>[c,i]).filter(([c])=>c.col===co&&c.linha===l).map(([c,i])=>
      `<button class="mc" data-sm="${i}"><div class="ph vph"><img src="${DRV(c.fotos[0],600)}" alt="" loading="lazy"></div><div class="kind">${KIND[c.linha]||''}</div><h3>${esc(short(c))}</h3><div class="from">${c.fotos.length} ${c.fotos.length>1?'fotos':'foto'}</div></button>`).join('')}</div>`).join('');
    return;
  }
  const c=CATALOGO[S.show], mi=M.findIndex(m=>m.nome===(c.modelo||c.nome)), n=c.fotos.length;
  el.innerHTML=`<div class="det show"><button class="back" data-sm="">← Catálogo</button>
   <div class="sh"><div><div class="kind" style="margin-top:0">${KIND[c.linha]||''}</div><h2>${esc(short(c))}</h2></div>
   ${mi>=0?`<button class="btn" data-precos="${mi}">Ver preços</button>`:c.busca?`<button class="btn" data-busca="${esc(c.busca)}" data-bcol="${esc(c.col)}">Ver preços</button>`:''}</div>
   <div class="stage"><img id="sim" src="${DRV(c.fotos[S.foto],1600)}" alt="${esc(c.nome)}">
     ${n>1?`<button class="arw l" data-nav="-1" aria-label="Foto anterior">‹</button><button class="arw r" data-nav="1" aria-label="Próxima foto">›</button>`:''}
     <div class="cnt"><span id="scn">${S.foto+1} / ${n}</span>${document.fullscreenEnabled?'<button data-fs aria-label="Tela cheia">Tela cheia</button>':''}</div></div>
   ${n>1?`<div class="thumbs">${c.fotos.map((f,i)=>`<button data-fi="${i}" class="${i===S.foto?'on':''}" aria-label="Foto ${i+1}"><img src="${DRV(f,300)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}</div>`;
  const st=$('.stage');let x0=null;
  st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)setFoto(S.foto+(dx<0?1:-1));x0=null});
  preload();
}
function setFoto(i){
  const c=CATALOGO[S.show];if(!c)return;const n=c.fotos.length;S.foto=(i%n+n)%n;
  const im=$('#sim');if(!im)return;im.classList.add('fade');
  const nx=new Image();nx.onload=nx.onerror=()=>{im.src=nx.src;im.classList.remove('fade')};nx.src=DRV(c.fotos[S.foto],1600);
  $('#scn').textContent=`${S.foto+1} / ${n}`;
  document.querySelectorAll('.thumbs button').forEach((b,k)=>b.classList.toggle('on',k===S.foto));
  const tb=document.querySelector('.thumbs button.on');if(tb)tb.scrollIntoView({block:'nearest',inline:'nearest'});
  preload();
}
function preload(){const c=CATALOGO[S.show];if(!c)return;[1,-1].forEach(k=>{const n=c.fotos.length;new Image().src=DRV(c.fotos[((S.foto+k)%n+n)%n],1600)})}
document.addEventListener('keydown',e=>{if(S.view!=='show'||S.show==null||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName))return;
  if(e.key==='ArrowRight'){setFoto(S.foto+1);e.preventDefault()}else if(e.key==='ArrowLeft'){setFoto(S.foto-1);e.preventDefault()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.xopc!=null){S.xoff=S.xoff||{};S.xoff[d.xopc]=!e.target.checked;main();return}if(d.say!=null){S.cur.items[+d.say].say=e.target.checked;touch();side()}else if(d.tec!=null){S.cur.items[+d.tec].tecido=e.target.value;touch();side()}else if(d.tom!=null){S.cur.items[+d.tom].tom=e.target.value;touch();side()}});
document.addEventListener('input',e=>{const i=e.target.dataset.tecf;if(i!=null){S.cur.items[+i].tecido=e.target.value;touch();stOnly()}});
$('#cli').oninput=e=>{S.cur.cliente=e.target.value;touch();stOnly()};$('#ref').oninput=e=>{S.cur.ref=e.target.value;touch();stOnly()};
$('#desc').oninput=e=>{S.cur.desc=parseFloat(String(e.target.value).replace(',','.'))||0;touch();const t=totals();$('#ipi').textContent=brl(t.ipi);$('#tot').textContent=brl(t.tot);stOnly()};
$('#obs').oninput=e=>{S.cur.obs=e.target.value;touch();stOnly()};
$('#prazo').onchange=e=>{S.cur.prazo=e.target.value;e.target.className=e.target.value?'':'vz';touch();stOnly()};
function stOnly(){const c=S.cur;$('#sal').disabled=ro()||!c.items.length;if(c.id)$('#st').innerHTML='<b>Alterações não salvas</b>';doc();draft()}
$('#pdf').onclick=()=>{if(COARSE.matches)return enviarPDF();const o=document.title;document.title='Orçamento Elle Elle'+(S.cur.cliente?' - '+S.cur.cliente:'');window.print();document.title=o};
$('#sal').onclick=salvar;
function resumo(b){
  const c=S.cur,t=totals(),B=x=>b?'*'+x+'*':x,L=[];
  L.push(B('Orçamento Elle Elle'));
  if(c.cliente)L.push('Cliente: '+c.cliente); if(c.ref)L.push('Referência: '+c.ref);
  L.push('Vendedor: '+nomeDe(c.owner||U.id)); L.push('Data: '+(c.criado?dt(c.criado):new Date().toLocaleDateString('pt-BR'))); L.push('');
  c.items.forEach((it,i)=>{
    L.push(B((i+1)+'. '+(it.xn?it.xn+' · ':'')+it.ref)+(it.dims?' ('+it.dims+' cm)':''));
    const d=[it.oplab!=='—'?it.oplab:'',tecLab(it),it.say?'Pés em cor Sayerlack (+15%)':''].filter(Boolean).join(' · '); if(d)L.push('   '+d);
    L.push('   '+it.q+' × '+brl(unit(it))+' = '+brl(unit(it)*it.q));});
  L.push(''); L.push('Subtotal: '+brl(t.sub)); if(t.d)L.push('Desconto ('+pct(t.d)+'): − '+brl(t.dv));
  L.push('IPI ('+pct(IPI)+'): '+brl(t.ipi)); L.push(B('Total: '+brl(t.tot))); L.push('');
  L.push('Prazo de pagamento: '+(c.prazo||'a definir')); L.push('Frete: FOB');
  if((c.obs||'').trim()){L.push('');L.push('Observações: '+c.obs.trim())}
  return L.join('\n');
}
$('#shr').onclick=e=>{e.stopPropagation();$('#shm').hidden=!$('#shm').hidden;if(S.cur.items.length)prepItens().catch(()=>{})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-sh]');
  if(b){const c=S.cur;
    if(b.dataset.sh==='pdf')enviarPDF();
    else if(b.dataset.sh==='wa')window.open('https://wa.me/?text='+encodeURIComponent(resumo(true)),'_blank','noopener');

$('#nov').onclick=e=>{const c=S.cur;if(c.dirty&&c.items.length&&!ro()&&!arm(e.target,'Descartar?'))return;S.cur=novo();main();side()};

$('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;$('#le').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;if(error)$('#le').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar. Verifique a conexão e tente novamente.';};
let booted=null;
async function boot(user){
  if(booted===user.id)return;booted=user.id;U=user;
  $('#login').hidden=true;$('#app').hidden=false;$('main').innerHTML='<p class="note">Carregando tabela de preços…</p>';
  const [pf,tb]=await Promise.all([sb.from('perfis').select('id,nome,email,is_master'),sb.from('tabelas').select('edicao,dados').eq('ativa',true).order('id',{ascending:false}).limit(1)]);
  P={};(pf.data||[]).forEach(p=>P[p.id]=p);if(!P[U.id])P[U.id]={nome:(U.email||'').split('@')[0],email:U.email};
  MASTER=!!(P[U.id]&&P[U.id].is_master);
  if(tb.error||pf.error)toast('Erro ao carregar dados do banco.');
  const t=(tb.data||[])[0];M=t?(t.dados.models||[]):[];T=t?(t.dados.tecidos||{}):{};X=t?(t.dados.expostos||[]):[];ED=t?t.edicao:'';$('#ed').textContent=ED?`Tabela ${ED}`:'';
  S.cur=novo();S.view='cat';S.model=null;S.hist=null;S.filtro='';
  try{const s=JSON.parse(localStorage.getItem(dkey())||'null');if(s&&s.cur&&Array.isArray(s.cur.items)){S.cur=Object.assign(novo(),s.cur);S.grupo=s.grupo||'A'}}catch(e){}
  main();side();
}
function out(){booted=null;U=null;M=[];P={};$('#app').hidden=true;$('#login').hidden=false;$('#pw').value='';}
sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{if(session&&session.user)boot(session.user);else out()},0)});

// Gera o PDF do orçamento dentro da página (jsPDF), no mesmo desenho da versão impressa.
// Biblioteca, fontes e miniaturas do PDF são baixadas só quando necessárias (e ficam guardadas).
let _pdfP=null;
function prepPDF(){
  if(_pdfP)return _pdfP;
  _pdfP=(async()=>{
    if(!window.jspdf)await new Promise((ok,no)=>{const s=document.createElement('script');s.src=PDFA.lib;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const F={};
    await Promise.all(Object.entries(PDFA.fonts).map(async([k,u])=>{const b=new Uint8Array(await (await fetch(u)).arrayBuffer());let t='';for(let i=0;i<b.length;i+=32768)t+=String.fromCharCode.apply(null,b.subarray(i,i+32768));F[k]=btoa(t)}));
    PDFA.fontData=F;
  })().catch(e=>{_pdfP=null;throw e});
  return _pdfP;
}
const _th={};
function thumb(nome){
  if(_th[nome])return _th[nome];const src=IMGS[nome];if(!src)return Promise.resolve(null);
  return _th[nome]=new Promise(ok=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,320/im.naturalWidth,240/im.naturalHeight),c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const x=c.getContext('2d');x.fillStyle='rgb(239,234,225)';x.fillRect(0,0,c.width,c.height);
    x.globalCompositeOperation='multiply';x.drawImage(im,0,0,c.width,c.height);ok({d:c.toDataURL('image/jpeg',.86),w:c.width,h:c.height})};im.onerror=()=>ok(null);im.src=src});
}
async function prepItens(){await prepPDF();const T={};for(const it of S.cur.items)T[it.nome]=await thumb(it.nome);PDFA.thumbs=T}
function gerarPDF(){
  const {jsPDF}=window.jspdf, d=new jsPDF({unit:'mm',format:'a4',compress:true});
  for(const k in PDFA.fontData){d.addFileToVFS(k+'.ttf',PDFA.fontData[k]);d.addFont(k+'.ttf',k,'normal')}
  const c=S.cur,t=totals(),data=c.criado?dt(c.criado):new Date().toLocaleDateString('pt-BR');
  const W=210,H=297,L=16,R=194,INK=[33,26,23],INK2=[74,64,58],MUT=[140,128,118],LINE=[221,212,199],BR=[154,123,85],BG=[248,245,239],PAN=[239,234,225];
  const PT=0.3528;
  const font=(f,s,col)=>{d.setFont(f,'normal');d.setFontSize(s);d.setTextColor(...(col||INK));d.setCharSpace(0)};
  const txt=(s,x,y,al)=>d.text(String(s),x,y,al?{align:al}:undefined);
  const lab=(s,x,y,size,col,al)=>{font('JostM',size||6.5,col||BR);s=String(s).toUpperCase();const cs=(size||6.5)*PT*0.3;const w=d.getTextWidth(s)+cs*s.length;d.setCharSpace(cs);d.text(s,al==='right'?x-w+cs:x,y);d.setCharSpace(0)};
  const rule=(y,col,w,x1,x2)=>{d.setDrawColor(...(col||LINE));d.setLineWidth(w||0.15);d.line(x1||L,y,x2||R,y)};
  const bg=()=>{d.setFillColor(...BG);d.rect(0,0,W,H,'F')};
  const foot=()=>{lab('Elle Elle · Orçamento emitido em '+data,L,288,6,MUT);};
  let y;
  const thead=()=>{lab('Produto',41,y,6);lab('Grupo / acabamento',104,y,6);lab('Qtd',152,y,6);lab('Unitário',174,y,6,BR,'right');lab('Total',R,y,6,BR,'right');y+=2.6;rule(y,INK,0.25);};
  const nova=()=>{foot();d.addPage();bg();y=20;};
  const cabe=(h)=>{if(y+h>278){nova();return true}return false};

  // cabeçalho
  bg();d.setFillColor(...INK);d.rect(0,0,W,46,'F');
  d.addImage(PDFA.logo,'JPEG',L,14,15*PDFA.logoR,15);
  font('Corm',34,[244,239,231]);txt('Orçamento',R,29,'right');
  lab('Tabela de preços '+ED,R,36,7,[207,195,178],'right');
  // dados
  y=58;const cols=[[L,'Cliente',c.cliente||'—',54],[74,'Referência',c.ref||'—',43],[121,'Vendedor',nomeDe(c.owner||U.id),42],[167,'Data',data,27]];
  let mh=0;cols.forEach(([x,l,v,w])=>{lab(l,x,y);font('JostR',10);const ls=d.splitTextToSize(String(v),w).slice(0,2);d.text(ls,x,y+6);mh=Math.max(mh,ls.length)});
  y+=10+(mh-1)*4.4+4;rule(y,INK,0.25);y+=8;thead();
  // itens
  c.items.forEach(it=>{
    font('JostL',7.6);const refL=d.splitTextToSize(it.ref+(it.dims?' · '+it.dims+' cm':''),58);
    const sub=[];if(tecLab(it))sub.push(tecLab(it));if(it.say)sub.push('Pés em cor Sayerlack (+15%)');if(it.op==='FORN'&&it.tec)sub.push((it.tec*it.q).toFixed(1).replace('.',',')+' m de tecido');
    const subL=sub.flatMap(s=>d.splitTextToSize(s,42));
    const h=Math.max(20.4,9+4+refL.length*3.6+3,8.6+subL.length*3.8+5);
    if(cabe(h)){thead()}
    d.setFillColor(...PAN);d.rect(L,y+2.7,22,15,'F');
    const th=(PDFA.thumbs||{})[it.nome];if(th){const mw=19.8,mhh=13.5,r=th.w/th.h;let w=mw,hh=mw/r;if(hh>mhh){hh=mhh;w=mhh*r}d.addImage(th.d,'JPEG',L+(22-w)/2,y+2.7+(15-hh)/2,w,hh)}
    font('Corm',13);txt(it.xn||it.nome,41,y+9);
    font('JostL',7.6,INK2);d.text(refL,41,y+13.4,{lineHeightFactor:1.3});
    font('JostR',8.6);txt(it.oplab,104,y+8.6);
    font('JostL',7.6,INK2);if(subL.length)d.text(subL,104,y+12.8,{lineHeightFactor:1.42});
    font('JostR',8.6);txt(it.q,154.5,y+10.6,'center');txt(brl(unit(it)),174,y+10.6,'right');txt(brl(unit(it)*it.q),R,y+10.6,'right');
    y+=h;rule(y);
  });
  // condições e totais
  const nt=3+(t.d?1:0);cabe(16+nt*5.6+18);
  y+=9;const y0=y;
  lab('Prazo de pagamento',L,y);font('JostR',10);txt(c.prazo||'A definir',L,y+6);
  lab('Frete',66,y);font('JostR',10);txt('FOB',66,y+6);
  const TL=116;y=y0+2;
  const linha=(a,b)=>{font('JostR',9,INK2);txt(a,TL,y);txt(b,R,y,'right');y+=7.6};
  linha('Subtotal',brl(t.sub));if(t.d)linha('Desconto ('+pct(t.d)+')','− '+brl(t.dv));linha('IPI ('+pct(IPI)+')',brl(t.ipi));
  y-=2.6;rule(y,INK,0.25,TL,R);y+=10;
  lab('Total',TL,y-0.6);font('Corm',22);txt(brl(t.tot),R,y,'right');y+=10;
  // observações do pedido
  const bloco=(titulo,paras,size,lh,col,f)=>{
    cabe(22);rule(y);y+=8;lab(titulo,L,y);y+=6;
    paras.forEach(p=>{font(f,size,col);d.splitTextToSize(p,R-L).forEach(l=>{if(y>281){nova()}font(f,size,col);txt(l,L,y);y+=lh});y+=1.2});
    y+=4;
  };
  if((c.obs||'').trim())bloco('Observações do pedido',c.obs.trim().split(/\n+/),9,4.7,INK,'JostR');
  bloco('Informações gerais',CFG.obs.map(o=>o.replace('__ED__',ED)),7.4,3.9,INK2,'JostL');
  foot();
  const n=d.getNumberOfPages();if(n>1)for(let i=1;i<=n;i++){d.setPage(i);font('JostR',7,MUT);txt(i+' / '+n,R,288,'right')}
  const nome=('Orçamento Elle Elle'+(c.cliente?' - '+c.cliente:'')).replace(/[\\/:*?"<>|]+/g,' ').trim()+'.pdf';
  return {blob:d.output('blob'),nome};
}
async function enviarPDF(){
  let r;toast('Gerando PDF…');try{await prepItens();r=gerarPDF()}catch(e){console.error(e);toast('Não foi possível gerar o PDF. Verifique a conexão.');return}
  const file=new File([r.blob],r.nome,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:r.nome.replace(/\.pdf$/,'')}).catch(e=>{if(e&&e.name!=='AbortError'){baixar(r);toast('PDF baixado. Anexe o arquivo na conversa.')}});
  }else{baixar(r);toast('PDF baixado. Anexe o arquivo na conversa.')}
}
function baixar(r){const u=URL.createObjectURL(r.blob),a=document.createElement('a');a.href=u;a.download=r.nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
</script></body></html>
